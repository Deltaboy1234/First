name: Fieldroom Linux test
on:
  push:
    paths:
      - "linux-photo-editor/**"
      - ".github/workflows/fieldroom-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: linux-photo-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the desktop application
        run: |
          bash install.sh
          cd "$RUNNER_TEMP"
          "$HOME/.local/bin/fieldroom-desktop" --help
          "$HOME/.local/share/fieldroom/venv/bin/python" -c 'from fieldroom.server import WEB; import rawpy; assert (WEB/"index.html").is_file()'
          test -s "$HOME/.local/share/applications/io.github.deltaboy1234.Fieldroom.desktop"
      - name: Prepare verified public Smart Crop test photos
        run: |
          "$HOME/.local/share/fieldroom/venv/bin/python" tests/fetch_smartcrop_fixtures.py "$RUNNER_TEMP/fieldroom-model-fixtures"
      - name: Verify native zoom and export with a Nikon NEF
        run: |
          export FIELDROOM_TEST_NEF="$RUNNER_TEMP/iss030e122639.NEF"
          export FIELDROOM_SMARTCROP_FIXTURES="$RUNNER_TEMP/fieldroom-model-fixtures"
          curl --fail --silent --show-error --location --retry 2 \
            "https://raw.githubusercontent.com/letmaik/rawpy/2705f5b223c162c3cbc48474fe1a01c3cf09fa4f/test/iss030e122639.NEF" \
            -o "$FIELDROOM_TEST_NEF"
          test "$(git hash-object "$FIELDROOM_TEST_NEF")" = "e03d193927a604de40fd0fd7a71e33fde878a0e1"
          "$HOME/.local/share/fieldroom/venv/bin/python" -m unittest discover -s tests -v
      - name: Exercise the desktop browser at two pixel densities
        run: |
          npm install --prefix "$RUNNER_TEMP/fieldroom-test" --no-save --no-audit --no-fund playwright@1.56.1
          export NODE_PATH="$RUNNER_TEMP/fieldroom-test/node_modules"
          export FIELDROOM_PYTHON="$HOME/.local/share/fieldroom/venv/bin/python"
          if command -v google-chrome >/dev/null; then
            export FIELDROOM_BROWSER="$(command -v google-chrome)"
          else
            "$RUNNER_TEMP/fieldroom-test/node_modules/.bin/playwright" install chromium
          fi
          node tests/smartcrop_ui.cjs
          node tests/browser.cjs
          export FIELDROOM_SMARTCROP_IMAGE="$RUNNER_TEMP/fieldroom-model-fixtures/basketball1.png"
          export FIELDROOM_SMARTCROP_SCREENSHOT="$RUNNER_TEMP/Fieldroom-Smart-Crop.png"
          export FIELDROOM_GROUPCROP_SCREENSHOT="$RUNNER_TEMP/Fieldroom-Group-Crop.png"
          node tests/smartcrop_browser.cjs
      - name: Build and test the portable offline trial
        run: |
          export FIELDROOM_PYTHON="$HOME/.local/share/fieldroom/venv/bin/python"
          export NODE_PATH="$RUNNER_TEMP/fieldroom-test/node_modules"
          if command -v google-chrome >/dev/null; then
            export FIELDROOM_BROWSER="$(command -v google-chrome)"
          fi
          "$FIELDROOM_PYTHON" browser-trial/build.py "$RUNNER_TEMP/Fieldroom-Browser-Trial.html"
          node tests/browser_trial.cjs "$RUNNER_TEMP/Fieldroom-Browser-Trial.html"
          curl --fail --silent --show-error --location --retry 2 \
            "https://raw.githubusercontent.com/f-spot/raw-samples/54425e2cd53ec17d5fd88ee3277d03f54bf1fe84/DNG/RAW_LEICA_M8.DNG" \
            -o "$RUNNER_TEMP/Leica-M8.dng"
          test "$(git hash-object "$RUNNER_TEMP/Leica-M8.dng")" = "aef6a299e5857877f5e45f566c5e193c6329c0a8"
          node tests/browser_raw.cjs "$RUNNER_TEMP/Fieldroom-Browser-Trial.html" "$RUNNER_TEMP/Leica-M8.dng" "$RUNNER_TEMP/iss030e122639.NEF"
      - uses: actions/upload-artifact@v4
        with:
          name: Fieldroom-Browser-Trial
          path: ${{ runner.temp }}/Fieldroom-Browser-Trial.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fieldroom-Smart-Crop-Check
          path: |
            ${{ runner.temp }}/Fieldroom-Smart-Crop.png
            ${{ runner.temp }}/Fieldroom-Group-Crop.png
          if-no-files-found: ignore
